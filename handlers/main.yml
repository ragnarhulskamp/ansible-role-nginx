---
- name: validate nginx configuration
  command: nginx -t -c {{ nginx_conf_file_path }}
  changed_when: false
  when: nginx_service_state != 'stopped'
  become: yes

- name: restart nginx
  service: name=nginx state=restarted
  when: nginx_service_state != 'stopped'
  become: yes

- name: reload nginx
  service: name=nginx state=reloaded
  when: nginx_service_state != 'stopped'
  become: yes
