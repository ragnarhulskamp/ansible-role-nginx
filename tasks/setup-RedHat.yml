---
- name: Enable nginx repo.
  template:
    src: nginx.repo.j2
    dest: /etc/yum.repos.d/nginx.repo
    owner: root
    group: "{{ root_group }}"
    mode: 0644
  when: nginx_yum_repo_enabled | bool
  become: true

- name: Remove role-owned upstream repo when distribution packages are selected
  ansible.builtin.file:
    path: /etc/yum.repos.d/nginx.repo
    state: absent
  when: not nginx_yum_repo_enabled | bool
  become: true

- name: Inspect enabled distribution nginx stream
  ansible.builtin.command: cat /etc/dnf/modules.d/nginx.module
  register: nginx_enabled_stream
  failed_when: nginx_enabled_stream.rc not in [0, 1]
  changed_when: false
  check_mode: false
  when: nginx_redhat_module_stream | length > 0
  become: true

- name: Switch nginx to the supported distribution stream
  ansible.builtin.command:
    argv:
      - dnf
      - --setopt=timeout=20
      - --setopt=retries=2
      - -y
      - module
      - switch-to
      - "nginx:{{ nginx_redhat_module_stream }}"
  when:
    - nginx_redhat_module_stream | length > 0
    - not (nginx_enabled_stream.stdout is regex("(?m)^stream\\s*=\\s*" ~ (nginx_redhat_module_stream | regex_escape) ~ "\\s*$") and nginx_enabled_stream.stdout is regex("(?m)^state\\s*=\\s*enabled\\s*$"))
  become: true
  notify:
    - validate nginx configuration
    - restart nginx

- name: Ensure nginx is installed.
  ansible.builtin.raw: |
    set -e
    if rpm -q {{ nginx_package_name }} >/dev/null 2>&1; then
      exit 0
    fi
    if command -v dnf >/dev/null 2>&1; then
      dnf -y install {{ nginx_package_name }}
    else
      yum -y install {{ nginx_package_name }}
    fi
    echo __nginx_install_changed__
  args:
    executable: /bin/bash
  register: nginx_install
  changed_when: "'__nginx_install_changed__' in (nginx_install.stdout | default(''))"
  become: true

- name: Ensure logrotate is installed.
  ansible.builtin.raw: |
    set -e
    if rpm -q logrotate >/dev/null 2>&1; then
      exit 0
    fi
    if command -v dnf >/dev/null 2>&1; then
      dnf -y install logrotate
    else
      yum -y install logrotate
    fi
    echo __nginx_logrotate_install_changed__
  args:
    executable: /bin/bash
  register: nginx_logrotate_install
  changed_when: "'__nginx_logrotate_install_changed__' in (nginx_logrotate_install.stdout | default(''))"
  tags:
    - nginx_logrotate
  become: true

- name: Ensure SELinux port management tools are installed.
  ansible.builtin.raw: |
    set -e
    if rpm -q {{ selinux_port_pkg }} >/dev/null 2>&1; then
      exit 0
    fi
    if command -v dnf >/dev/null 2>&1; then
      dnf -y install {{ selinux_port_pkg }}
    else
      yum -y install {{ selinux_port_pkg }}
    fi
    echo __nginx_selinux_tools_changed__
  args:
    executable: /bin/bash
  vars:
    selinux_port_pkg: "{{ 'policycoreutils-python-utils' if (ansible_distribution_major_version | int) >= 8 else 'policycoreutils-python' }}"
  register: nginx_selinux_port_tools
  changed_when: "'__nginx_selinux_tools_changed__' in (nginx_selinux_port_tools.stdout | default(''))"
  when:
    - ansible_selinux is defined
    - ansible_selinux.status != 'disabled'
  become: true

- name: Allow nginx backend ports in SELinux
  ansible.builtin.raw: |
    set -e
    if semanage port -l | awk '$1=="http_port_t" && $2=="tcp"{for (i=3; i<=NF; i++) print $i}' | tr ',' '\n' | tr -d ' ' | grep -x "{{ item }}" >/dev/null 2>&1; then
      exit 0
    fi
    if semanage port -l | awk '$2=="tcp"{for (i=3; i<=NF; i++) print $i}' | tr ',' '\n' | tr -d ' ' | grep -x "{{ item }}" >/dev/null 2>&1; then
      semanage port -m -t http_port_t -p tcp {{ item }}
    else
      semanage port -a -t http_port_t -p tcp {{ item }}
    fi
    echo changed
  args:
    executable: /bin/bash
  register: nginx_selinux_ports
  changed_when: "'changed' in (nginx_selinux_ports.stdout | default(''))"
  loop: "{{ nginx_backend_http_ports }}"
  when:
    - ansible_selinux is defined
    - ansible_selinux.status != 'disabled'
    - nginx_backend_http_ports | length > 0
  become: true
